# Render Blueprint — https://render.com/docs/blueprint-spec
# Deploy with: render blueprint apply (or via Render Dashboard → Blueprint)

services:
  - type: web
    name: pharma-alert
    env: python
    region: oregon  # us-east, oregon, frankfurt, singapore, etc.
    plan: free      # MVP — upgrade to starter/pro as needed

    buildCommand: |
      pip install --no-cache-dir -r requirements.txt

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      # ── Required: PostgreSQL connection string ──
      - key: DATABASE_URL
        sync: false  # mark as "secret" — typed manually in Dashboard

      # ── Required: API key for mutating endpoints (X-API-Key header) ──
      # Set this in the Render Dashboard BEFORE deploying — mutating
      # endpoints are disabled while it is empty.
      - key: API_KEY
        sync: false

      # ── Optional: error tracking (https://sentry.io → create project) ──
      - key: SENTRY_DSN
        sync: false

      # ── Optional: notification channels ──
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: DISCORD_WEBHOOK_URL
        sync: false
      - key: DISCORD_WEBHOOK_HIGH_IMPACT
        sync: false
      - key: DISCORD_WEBHOOK_SEC_LIVE
        sync: false
      - key: DISCORD_WEBHOOK_BRIEFING
        sync: false
      - key: DISCORD_WEBHOOK_CLINICAL
        sync: false
      - key: DISCORD_WEBHOOK_NEWS
        sync: false

      # ── App settings ──
      - key: ALERT_DAYS_BEFORE
        value: "7"
      - key: REFRESH_INTERVAL_HOURS
        value: "6"
      - key: BASE_URL
        value: https://pharma-edge.onrender.com
      - key: TIMEZONE
        value: America/New_York
